name: Docs

# Publica o Storybook (stories, docs e testes de interacao) no GitHub Pages a cada push em main:
# https://tooark.github.io/web-components/ — habilite Pages com "Source: GitHub Actions" nas configuracoes do repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O Storybook aponta para o src dos pacotes (aliases em main.ts): nenhum build de pacote e necessario.
      - name: Build Storybook
        run: pnpm --filter storybook build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storybook/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
