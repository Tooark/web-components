name: Release

# Publica todos os @tooark/* no npm quando a versao do package.json raiz ainda nao esta no registry (mesmo fluxo
# dos outros repos Tooark): bump com `pnpm version`, merge em main, e o workflow lint + build + testes, publica em
# ordem topologica, cria a tag vX.Y.Z e a GitHub Release com a secao correspondente do CHANGELOG.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # Provenance (attestation assinada pelo GitHub) do `npm publish`.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "tag=next" >> "$GITHUB_OUTPUT"; else echo "tag=latest" >> "$GITHUB_OUTPUT"; fi

      # A versao raiz e a fonte da verdade (scripts/sync-versions.mjs): basta olhar um pacote.
      - name: Check if already published
        id: check
        run: |
          if npm view "@tooark/web-components@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.version.outputs.version }} is already on npm"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.published == 'false'
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        if: steps.check.outputs.published == 'false'
        run: pnpm exec biome ci .

      - name: Build packages
        if: steps.check.outputs.published == 'false'
        run: pnpm -r build

      - name: Check the tarballs (publint, attw)
        if: steps.check.outputs.published == 'false'
        run: pnpm check:publish

      - name: SSR smoke test
        if: steps.check.outputs.published == 'false'
        run: pnpm check:ssr

      - name: Install Playwright Chromium
        if: steps.check.outputs.published == 'false'
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Storybook component tests
        if: steps.check.outputs.published == 'false'
        run: pnpm --filter storybook exec vitest run --project storybook

      # pnpm publica em ordem topologica, pula os privados (raiz, storybook), troca workspace:^ pela versao e
      # respeita publishConfig.directory (Angular publica de dist/).
      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance (attestation) so existe para repositorio publico: num privado o npm recusa o publish.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
        run: pnpm -r publish --access public --tag ${{ steps.version.outputs.tag }} --no-git-checks

      - name: Tag and GitHub Release
        if: steps.check.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if ! git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          node scripts/changelog-section.mjs "$VERSION" > release-notes.md
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$TAG" --title "Release $TAG" --notes-file release-notes.md $PRERELEASE || \
            echo "Release $TAG already exists"

      - name: Skip
        if: steps.check.outputs.published == 'true'
        run: echo "Nothing to publish."
