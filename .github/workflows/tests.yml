name: Tests

on:
  push:
    branches: [main]
  pull_request:

# So leitura: o job nao escreve nada no repositorio (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  component-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint, formatação e ordem de imports (Biome), antes do build.
      - name: Lint (Biome)
        run: pnpm exec biome ci .

      # Build de todos os pacotes: além de validar TypeScript/rollup, roda o
      # smoke test do CSS gerado (scripts/check-css.mjs) — garante que o
      # styles.css publicado foi compilado pelo Tailwind e contém as classes.
      - name: Build packages
        run: pnpm -r build

      # Empacota cada pacote como o publish faria e confere manifesto, exports e tipos (publint + attw).
      - name: Check the tarballs (publint, attw)
        run: pnpm check:publish

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Storybook component tests
        run: pnpm --filter storybook exec vitest run --project storybook --coverage
