name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  component-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build de todos os pacotes: além de validar TypeScript/rollup, roda o
      # smoke test do CSS gerado (scripts/check-css.mjs) — garante que o
      # styles.css publicado foi compilado pelo Tailwind e contém as classes.
      - name: Build packages
        run: pnpm -r build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Storybook component tests
        run: pnpm --filter storybook exec vitest run --project storybook --coverage
